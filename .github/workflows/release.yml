name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches the module version
        run: |
          $v = (Test-ModuleManifest ./PathShrink/PathShrink.psd1).Version.ToString()
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match module version $v" }
      - name: Test
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Invoke-Pester ./tests/PathShrink.Tests.ps1 -CI
      - name: Build
        run: ./tools/Build-Release.ps1
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = (Get-Content CHANGELOG.md -Raw) -split '(?m)^## ' | Where-Object { $_ -like "[$($env:GITHUB_REF_NAME.TrimStart('v'))]*" } | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME out/PathShrink.zip out/PathShrink.zip.sha256 --title "PathShrink $env:GITHUB_REF_NAME" --notes "## $notes"
      - name: Publish to PowerShell Gallery
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        if: env.PSGALLERY_API_KEY != ''
        run: Publish-Module -Path ./PathShrink -NuGetApiKey $env:PSGALLERY_API_KEY
